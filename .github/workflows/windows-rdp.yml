name: Linux Cloud VPS (SSH + RDP over Tailscale)

on:
  workflow_dispatch:
    inputs:
      keep_alive_hours:
        description: 'Keep-alive window (1 to 5 hours)'
        required: false
        default: '5'
        type: string
      custom_password:
        description: 'Custom Linux user password (leave empty for strong random)'
        required: false
        default: ''
        type: string
      ts_authkey:
        description: 'Tailscale Auth Key (tskey-auth-...)'
        required: true
        type: string

concurrency:
  group: linux-vps-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      SSH_USER: cloudadmin
      SSH_PORT: '22'
      RDP_PORT: '3389'
      TS_HOSTNAME_PREFIX: 'gh-linux'
      TS_STATE_DIR: /tmp/ts-state
      TS_SOCKET: /tmp/tailscaled.sock
      TS_STATE_FILE: /tmp/ts-state/tailscaled.state

    steps:
      # ============================================================
      # 1) Prepare Linux (system info snapshot)
      # ============================================================
      - name: 1. Prepare Linux
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::System information"
          uname -a
          lsb_release -a 2>/dev/null || cat /etc/os-release
          lscpu | head -n 20
          free -h
          df -h /
          hostname -I
          echo "::endgroup::"
          
          DISTRO=$( (. /etc/os-release && echo "$PRETTY_NAME") || echo "unknown" )
          KERNEL=$(uname -r)
          ARCH=$(uname -m)
          {
            echo "distro=$DISTRO"
            echo "kernel=$KERNEL"
            echo "arch=$ARCH"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 2) Create Linux user (cloudadmin) with sudo
      # ============================================================
      - name: 2. Create User
        id: create_user
        shell: bash
        env:
          CUSTOM_PASS: ${{ inputs.custom_password }}
        run: |
          set -euo pipefail
          USER_NAME="$SSH_USER"
          
          if [ -z "${CUSTOM_PASS:-}" ]; then
            PLAIN="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9!@#%^&*()-_=+' | head -c 24 || true)"
            echo "Password source: RANDOM (24 chars)"
          else
            PLAIN="$CUSTOM_PASS"
            echo "Password source: CUSTOM"
          fi
          
          if [ ${#PLAIN} -lt 8 ]; then
            echo "::error::Password must be at least 8 characters."
            exit 1
          fi
          
          echo "::add-mask::$PLAIN"
          
          if ! id -u "$USER_NAME" >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash "$USER_NAME" || { echo "::error::useradd failed"; exit 1; }
          fi
          
          echo "$USER_NAME:$PLAIN" | sudo chpasswd
          sudo usermod -aG sudo "$USER_NAME"
          
          # Passwordless sudo
          echo "$USER_NAME ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/90-$USER_NAME >/dev/null
          sudo chmod 0440 /etc/sudoers.d/90-$USER_NAME
          
          {
            echo "plain_password=$PLAIN"
            echo "username=$USER_NAME"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 3) Install & Configure OpenSSH Server
      # ============================================================
      - name: 3. Setup SSH Server
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server
          
          # FIX: privilege separation dir (runner has no systemd)
          sudo mkdir -p /run/sshd
          sudo chmod 0755 /run/sshd
          sudo ssh-keygen -A
          
          # Set a strong random root password (defense-in-depth)
          ROOT_PASS="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9!@#%^&*' | head -c 24 || true)"
          echo "::add-mask::$ROOT_PASS"
          echo "root:$ROOT_PASS" | sudo chpasswd
          
          # sshd config
          sudo mkdir -p /etc/ssh/sshd_config.d
          sudo tee /etc/ssh/sshd_config.d/99-cloud.conf >/dev/null <<EOF
          Port ${SSH_PORT}
          PermitRootLogin prohibit-password
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          AllowUsers ${SSH_USER}
          UsePAM yes
          X11Forwarding yes
          ClientAliveInterval 60
          ClientAliveCountMax 3
          EOF
          
          sudo /usr/sbin/sshd -t
          sudo service ssh restart || { echo "::error::failed to start ssh"; sudo service ssh status || true; exit 1; }
          
          sleep 1
          sudo ss -tlnp | grep ":${SSH_PORT}" || { echo "::error::sshd not listening on ${SSH_PORT}"; exit 1; }
          echo "✅ sshd listening on port ${SSH_PORT}"

      # ============================================================
      # 3.5) Install Desktop Environment (XFCE) & xrdp
      # ============================================================
      - name: 3.5. Install Desktop & RDP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # Install lightweight desktop and xrdp
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xfce4 xfce4-goodies xrdp dbus-x11 socat
            
          # Configure xrdp to use XFCE session for the user
          echo "xfce4-session" > /home/$SSH_USER/.xsession
          sudo chown $SSH_USER:$SSH_USER /home/$SSH_USER/.xsession
          sudo chmod +x /home/$SSH_USER/.xsession
          
          # Ensure xrdp starts (no systemd, use service)
          sudo service xrdp restart || sudo /usr/sbin/xrdp --daemon
          sudo /usr/sbin/xrdp-sesman --daemon || true
          
          sleep 2
          # Check if xrdp is listening on 3389 (internally)
          sudo ss -tlnp | grep ":${RDP_PORT}" || { echo "::error::xrdp not listening"; exit 1; }
          echo "✅ xrdp listening on port ${RDP_PORT}"

      # ============================================================
      # 4) Install & Start Tailscale (userspace mode) + Port Forwarding
      # ============================================================
      - name: 4. Setup Tailscale & Forward Ports
        shell: bash
        env:
          TS_AUTHKEY: ${{ inputs.ts_authkey }}
        run: |
          set -euo pipefail
          
          if [ -z "${TS_AUTHKEY:-}" ]; then
            echo "::error::ts_authkey input is required."
            exit 1
          fi
          echo "::add-mask::$TS_AUTHKEY"
          
          # Install Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh
          
          # Userspace mode
          mkdir -p "$TS_STATE_DIR"
          
          sudo tailscaled \
            --tun=userspace-networking \
            --state="$TS_STATE_FILE" \
            --socket="$TS_SOCKET" \
            > /tmp/tailscaled.log 2>&1 &
            
          # Wait for socket
          for i in $(seq 1 30); do
            [ -S "$TS_SOCKET" ] && break
            sleep 1
          done
          
          if [ ! -S "$TS_SOCKET" ]; then
            echo "::error::tailscaled did not start"
            cat /tmp/tailscaled.log || true
            exit 1
          fi
          
          # Unique hostname per run
          TS_HOSTNAME="${TS_HOSTNAME_PREFIX}-$(date +%s | tail -c 7)"
          echo "TS_HOSTNAME=$TS_HOSTNAME" >> "$GITHUB_ENV"
          
          sudo tailscale --socket="$TS_SOCKET" up \
            --authkey="$TS_AUTHKEY" \
            --hostname="$TS_HOSTNAME" \
            --accept-routes
            
          echo "::group::Tailscale status"
          sudo tailscale --socket="$TS_SOCKET" status || true
          sudo tailscale --socket="$TS_SOCKET" ip -4 || true
          echo "::endgroup::"
          
          TS_IP=$(sudo tailscale --socket="$TS_SOCKET" ip -4 | head -n1)
          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"
          
          # FIX: In userspace mode, we need to forward TCP ports from Tailscale to localhost
          # This allows SSH (22) and RDP (3389) traffic to reach the services.
          echo "Setting up TCP port forwarding..."
          sudo socat TCP-LISTEN:${SSH_PORT},fork,reuseaddr TCP:127.0.0.1:${SSH_PORT} &
          sudo socat TCP-LISTEN:${RDP_PORT},fork,reuseaddr TCP:127.0.0.1:${RDP_PORT} &
          
          {
            echo "ts_hostname=$TS_HOSTNAME"
            echo "ts_ip=$TS_IP"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5) Keep-alive loop
      # ============================================================
      - name: 5. Keep-alive
        if: always()
        shell: bash
        env:
          KEEP_ALIVE_HOURS: ${{ inputs.keep_alive_hours }}
        run: |
          set -euo pipefail
          HOURS="${KEEP_ALIVE_HOURS:-5}"
          if ! [[ "$HOURS" =~ ^[1-5]$ ]]; then
            echo "::warning::Invalid keep_alive_hours='$HOURS', defaulting to 5"
            HOURS=5
          fi
          
          TS_HOSTNAME="${TS_HOSTNAME:-not-registered}"
          TS_IP="${TS_IP:-n/a}"
          if [ "$TS_IP" = "n/a" ]; then
            echo "::warning::Tailscale did not register. VPS is NOT reachable."
          fi
          
          END=$(( $(date +%s) + HOURS * 3600 ))
          echo "==============================================="
          echo "  VPS is UP"
          echo "  Host:     ${TS_HOSTNAME}"
          echo "  TS IP:    ${TS_IP}"
          echo "  SSH:      ssh ${SSH_USER}@${TS_IP}"
          echo "  RDP:      ${TS_IP}:${RDP_PORT}"
          echo "  User:     ${SSH_USER}"
          echo "  Expires:  $(date -u -d "@$END" '+%Y-%m-%d %H:%M:%S UTC')"
          echo "==============================================="
          
          while [ "$(date +%s)" -lt "$END" ]; do
            REMAIN=$(( END - $(date +%s) ))
            printf '[%s] alive — %02dh:%02dm remaining\n' \
              "$(date -u +%H:%M:%S)" \
              $((REMAIN/3600)) $(((REMAIN%3600)/60))
            sleep 60
          done
          echo "Keep-alive window ended, shutting down."

      # ============================================================
      # 6) Teardown (always)
      # ============================================================
      - name: 6. Teardown
        if: always()
        shell: bash
        run: |
          set +e
          # Kill socat forwards
          sudo pkill -f "socat TCP-LISTEN" || true
          # Tailscale down
          if [ -S "${TS_SOCKET}" ]; then
            sudo tailscale --socket="${TS_SOCKET}" down || true
          fi
          sudo pkill -f tailscaled || true
          # Stop xrdp
          sudo service xrdp stop || true
          exit 0

      # ============================================================
      # 7) Summary
      # ============================================================
      - name: 7. Summary
        if: always()
        shell: bash
        env:
          PLAIN_PASS: ${{ steps.create_user.outputs.plain_password }}
        run: |
          set +e
          {
            echo "## 🐧 Linux VPS Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Tailscale Host | \`${TS_HOSTNAME:-n/a}\` |"
            echo "| Tailscale IP | \`${TS_IP:-n/a}\` |"
            echo "| SSH User | \`${SSH_USER}\` |"
            echo "| SSH Port | \`${SSH_PORT}\` |"
            echo "| RDP Port | \`${RDP_PORT}\` |"
            echo "| Password | \`${PLAIN_PASS:-n/a}\` |"
            echo ""
            echo "### Connect"
            echo '```bash'
            echo "# SSH"
            echo "ssh ${SSH_USER}@${TS_IP:-HOSTNAME}"
            echo ""
            echo "# RDP"
            echo "Address: ${TS_IP:-HOSTNAME}:${RDP_PORT}"
            echo "User: ${SSH_USER}"
            echo '```'
            echo ""
            echo "> ⚠️ Password is masked in logs. Copy it from this summary."
            echo "> ⚠️ For RDP, use the **Tailscale IP** directly (not the hostname)."
          } >> "$GITHUB_STEP_SUMMARY"
