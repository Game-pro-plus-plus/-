name: Linux Cloud VPS (SSH + RDP over Tailscale)

on:
  workflow_dispatch:
    inputs:
      ssh_username:
        description: 'Linux username (lowercase, 3-20 chars)'
        required: true
        default: 'cloudadmin'
        type: string
      custom_password:
        description: 'Custom password (>=8 chars). Leave empty for random.'
        required: false
        default: ''
        type: string
      keep_alive_hours:
        description: 'Keep-alive window (1 to 5 hours)'
        required: false
        default: '5'
        type: string
      ts_authkey:
        description: 'Tailscale Auth Key (tskey-auth-...)'
        required: true
        type: string
      enable_rdp:
        description: 'Enable RDP (graphical desktop via xrdp)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: linux-vps-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      SSH_PORT: '22'
      RDP_PORT: '3389'
      TS_HOSTNAME_PREFIX: 'gh-linux'
      TS_STATE_DIR: /tmp/ts-state
      TS_SOCKET: /tmp/tailscaled.sock
      TS_STATE_FILE: /tmp/ts-state/tailscaled.state

    steps:
      # ============================================================
      # 0) Validate inputs
      # ============================================================
      - name: 0. Validate inputs
        shell: bash
        env:
          IN_USER: ${{ inputs.ssh_username }}
          IN_PASS: ${{ inputs.custom_password }}
          IN_HOURS: ${{ inputs.keep_alive_hours }}
          IN_TSKEY: ${{ inputs.ts_authkey }}
        run: |
          set -euo pipefail
          FAIL=0
          if ! [[ "$IN_USER" =~ ^[a-z][a-z0-9_-]{2,19}$ ]]; then
            echo "::error::ssh_username invalid (lowercase, 3-20 chars, start with letter)."; FAIL=1
          fi
          if [ "$IN_USER" = "root" ] || [ "$IN_USER" = "runner" ] || [ "$IN_USER" = "ubuntu" ]; then
            echo "::error::ssh_username '$IN_USER' is reserved."; FAIL=1
          fi
          if [ -n "$IN_PASS" ] && [ ${#IN_PASS} -lt 8 ]; then
            echo "::error::custom_password must be >= 8 chars."; FAIL=1
          fi
          if ! [[ "$IN_HOURS" =~ ^[1-5]$ ]]; then
            echo "::error::keep_alive_hours must be 1-5."; FAIL=1
          fi
          if [ -z "$IN_TSKEY" ]; then
            echo "::error::ts_authkey is required."; FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "SSH_USER=$IN_USER" >> "$GITHUB_ENV"
          echo "Validation OK."

      # ============================================================
      # 1) Prepare Linux
      # ============================================================
      - name: 1. Prepare Linux
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::System information"
          uname -a
          lsb_release -a 2>/dev/null || cat /etc/os-release
          echo "::endgroup::"

      # ============================================================
      # 2) Create Linux user with sudo
      # ============================================================
      - name: 2. Create User
        id: create_user
        shell: bash
        env:
          CUSTOM_PASS: ${{ inputs.custom_password }}
        run: |
          set -euo pipefail
          USER_NAME="$SSH_USER"
          if [ -z "${CUSTOM_PASS:-}" ]; then
            PLAIN="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9!@#%^&*()-_=+' | head -c 24 || true)"
          else
            PLAIN="$CUSTOM_PASS"
          fi
          if [ ${#PLAIN} -lt 8 ]; then
            echo "::error::Password must be at least 8 characters."; exit 1
          fi
          echo "::add-mask::$PLAIN"
          if ! id -u "$USER_NAME" >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash "$USER_NAME" || { echo "::error::useradd failed"; exit 1; }
          fi
          echo "$USER_NAME:$PLAIN" | sudo chpasswd
          sudo usermod -aG sudo "$USER_NAME"
          echo "$USER_NAME ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/90-$USER_NAME >/dev/null
          sudo chmod 0440 /etc/sudoers.d/90-$USER_NAME
          {
            echo "plain_password=$PLAIN"
            echo "username=$USER_NAME"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 3) Install & Configure OpenSSH Server
      # ============================================================
      - name: 3. Setup SSH Server
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server socat
          sudo mkdir -p /run/sshd
          sudo chmod 0755 /run/sshd
          sudo ssh-keygen -A
          ROOT_PASS="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9!@#%^&*' | head -c 24 || true)"
          echo "::add-mask::$ROOT_PASS"
          echo "root:$ROOT_PASS" | sudo chpasswd
          sudo mkdir -p /etc/ssh/sshd_config.d
          sudo tee /etc/ssh/sshd_config.d/99-cloud.conf >/dev/null <<EOF
          Port ${SSH_PORT}
          PermitRootLogin prohibit-password
          PasswordAuthentication yes
          AllowUsers ${SSH_USER}
          UsePAM yes
          EOF
          sudo /usr/sbin/sshd -t
          sudo service ssh restart || { echo "::error::failed to start ssh"; exit 1; }
          sleep 1
          sudo ss -tlnp | grep ":${SSH_PORT}" || { echo "::error::sshd not listening"; exit 1; }
          echo "✅ sshd listening on port ${SSH_PORT}"

      # ============================================================
      # 3.5) Install Desktop (XFCE) & xrdp
      # ============================================================
      - name: 3.5. Install Desktop & RDP
        if: ${{ inputs.enable_rdp == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          
          # نصب کامل محیط دسکتاپ و xrdp
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xfce4 xfce4-goodies xrdp dbus-x11

          # ساخت فایل .xsession
          echo "startxfce4" | sudo tee /home/$SSH_USER/.xsession > /dev/null
          sudo chown $SSH_USER:$SSH_USER /home/$SSH_USER/.xsession
          sudo chmod +x /home/$SSH_USER/.xsession

          # راه‌اندازی xrdp بدون systemd
          sudo service xrdp restart || sudo /usr/sbin/xrdp --daemon
          sudo /usr/sbin/xrdp-sesman --daemon || true

          sleep 2
          sudo ss -tlnp | grep ":${RDP_PORT}" || { echo "::error::xrdp not listening"; exit 1; }
          echo "✅ xrdp listening on port ${RDP_PORT}"

      # ============================================================
      # 4) Install & Start Tailscale (userspace mode)
      # ============================================================
      - name: 4. Setup Tailscale
        shell: bash
        env:
          TS_AUTHKEY: ${{ inputs.ts_authkey }}
        run: |
          set -euo pipefail
          if [ -z "${TS_AUTHKEY:-}" ]; then
            echo "::error::ts_authkey input is required."; exit 1
          fi
          echo "::add-mask::$TS_AUTHKEY"
          curl -fsSL https://tailscale.com/install.sh | sh
          mkdir -p "$TS_STATE_DIR"
          
          sudo tailscaled --tun=userspace-networking --state="$TS_STATE_FILE" --socket="$TS_SOCKET" > /tmp/tailscaled.log 2>&1 &
          
          for i in $(seq 1 30); do [ -S "$TS_SOCKET" ] && break; sleep 1; done
          if [ ! -S "$TS_SOCKET" ]; then
            echo "::error::tailscaled did not start"; cat /tmp/tailscaled.log || true; exit 1
          fi
          
          TS_HOSTNAME="${TS_HOSTNAME_PREFIX}-$(date +%s | tail -c 7)"
          echo "TS_HOSTNAME=$TS_HOSTNAME" >> "$GITHUB_ENV"
          
          sudo tailscale --socket="$TS_SOCKET" up --authkey="$TS_AUTHKEY" --hostname="$TS_HOSTNAME" --accept-routes
          
          echo "::group::Tailscale status"
          sudo tailscale --socket="$TS_SOCKET" status || true
          sudo tailscale --socket="$TS_SOCKET" ip -4 || true
          echo "::endgroup::"
          
          TS_IP=$(sudo tailscale --socket="$TS_SOCKET" ip -4 | head -n1)
          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

          # پاکسازی socat های قبلی
          sudo pkill -f "socat TCP-LISTEN" || true
          sleep 1
          sudo socat TCP-LISTEN:${SSH_PORT},fork,reuseaddr TCP:127.0.0.1:${SSH_PORT} &
          
          if [ "${{ inputs.enable_rdp }}" = "true" ]; then
            echo "Setting up socat forward for RDP..."
            sudo socat TCP-LISTEN:${RDP_PORT},fork,reuseaddr TCP:127.0.0.1:${RDP_PORT} &
          fi

          {
            echo "ts_hostname=$TS_HOSTNAME"
            echo "ts_ip=$TS_IP"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4.5) Fix XRDP Session (Force XFCE)
      # ============================================================
      - name: 4.5. Fix XRDP Session (Force XFCE)
        if: ${{ inputs.enable_rdp == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # پاک کردن سشن‌های خراب قبلی
          sudo pkill -u $SSH_USER xfce4-session || true
          sudo pkill -u $SSH_USER startxfce4 || true
          
          # بازنویسی کامل startwm.sh با دستور مستقیم برای جلوگیری از خطای failsafe
          sudo bash -c 'cat > /etc/xrdp/startwm.sh << "EOF"
          #!/bin/sh
          if [ -r /etc/default/locale ]; then
            . /etc/default/locale
            export LANG LANGUAGE
          fi
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          exec startxfce4
          EOF'
          sudo chmod +x /etc/xrdp/startwm.sh
          
          # اطمینان از وجود فایل .xsession
          echo "startxfce4" | sudo tee /home/$SSH_USER/.xsession > /dev/null
          sudo chown $SSH_USER:$SSH_USER /home/$SSH_USER/.xsession
          sudo chmod +x /home/$SSH_USER/.xsession
          
          # ری‌استارت xrdp
          sudo service xrdp restart || true
          sleep 2
          echo "✅ XRDP session forced to XFCE."

      # ============================================================
      # 5) Keep-alive loop (with self-healing)
      # ============================================================
      - name: 5. Keep-alive
        if: always()
        shell: bash
        env:
          KEEP_ALIVE_HOURS: ${{ inputs.keep_alive_hours }}
          ENABLE_RDP: ${{ inputs.enable_rdp }}
        run: |
          set -euo pipefail
          HOURS="${KEEP_ALIVE_HOURS:-5}"
          if ! [[ "$HOURS" =~ ^[1-5]$ ]]; then HOURS=5; fi
          
          TS_HOSTNAME="${TS_HOSTNAME:-not-registered}"
          TS_IP="${TS_IP:-n/a}"
          
          END=$(( $(date +%s) + HOURS * 3600 ))
          echo "==============================================="
          echo "  VPS is UP"
          echo "  Host:     ${TS_HOSTNAME}"
          echo "  TS IP:    ${TS_IP}"
          echo "  SSH User: ${SSH_USER}"
          echo "  SSH Port: ${SSH_PORT}"
          if [ "$ENABLE_RDP" = "true" ]; then
            echo "  RDP:      ${TS_IP}:${RDP_PORT}"
          fi
          echo "  Expires:  $(date -u -d "@$END" '+%Y-%m-%d %H:%M:%S UTC')"
          echo "==============================================="
          
          while [ "$(date +%s)" -lt "$END" ]; do
            REMAIN=$(( END - $(date +%s) ))
            
            # بررسی SSH
            if ! sudo ss -tlnp 2>/dev/null | grep -q ":${SSH_PORT}"; then
              echo "::warning::sshd not listening, restarting..."; sudo service ssh restart || true
            fi
            
            # بررسی RDP و socat
            if [ "$ENABLE_RDP" = "true" ]; then
              if ! sudo ss -tlnp 2>/dev/null | grep -q ":${RDP_PORT}"; then
                echo "::warning::xrdp not listening, restarting..."; sudo service xrdp restart || true
              fi
              if ! pgrep -f "socat TCP-LISTEN:${RDP_PORT}" >/dev/null 2>&1; then
                echo "::warning::RDP socat missing, restarting..."
                sudo socat TCP-LISTEN:${RDP_PORT},fork,reuseaddr TCP:127.0.0.1:${RDP_PORT} &
              fi
            fi
            
            # بررسی Tailscale
            if [ ! -S "$TS_SOCKET" ]; then
              echo "::warning::tailscaled socket missing, restarting..."
              sudo tailscaled --tun=userspace-networking --state="$TS_STATE_FILE" --socket="$TS_SOCKET" > /tmp/tailscaled.log 2>&1 &
              sleep 5
              sudo tailscale --socket="$TS_SOCKET" up --authkey="$TS_AUTHKEY" --hostname="$TS_HOSTNAME" --accept-routes || true
            fi
            
            printf '[%s] alive — %02dh:%02dm remaining\n' "$(date -u +%H:%M:%S)" $((REMAIN/3600)) $(((REMAIN%3600)/60))
            sleep 60
          done
          echo "Keep-alive window ended."

      # ============================================================
      # 6) Teardown
      # ============================================================
      - name: 6. Teardown
        if: always()
        shell: bash
        run: |
          set +e
          sudo pkill -f "socat TCP-LISTEN" || true
          if [ -S "${TS_SOCKET}" ]; then sudo tailscale --socket="${TS_SOCKET}" down || true; fi
          sudo pkill -f tailscaled || true
          sudo service xrdp stop || true
          exit 0

      # ============================================================
      # 7) Summary
      # ============================================================
      - name: 7. Summary
        if: always()
        shell: bash
        env:
          PLAIN_PASS: ${{ steps.create_user.outputs.plain_password }}
          ENABLE_RDP: ${{ inputs.enable_rdp }}
        run: |
          set +e
          {
            echo "## 🐧 Linux VPS Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Tailscale Host | \`${TS_HOSTNAME:-n/a}\` |"
            echo "| Tailscale IP | \`${TS_IP:-n/a}\` |"
            echo "| SSH User | \`${SSH_USER}\` |"
            echo "| SSH Port | \`${SSH_PORT}\` |"
            if [ "$ENABLE_RDP" = "true" ]; then
              echo "| RDP | \`${TS_IP:-n/a}:${RDP_PORT}\` |"
            fi
            echo "| Password | \`${PLAIN_PASS:-n/a}\` |"
            echo ""
            echo "### Connect"
            echo '```bash'
            echo "# SSH"
            echo "ssh ${SSH_USER}@${TS_IP:-HOSTNAME}"
            if [ "$ENABLE_RDP" = "true" ]; then
              echo ""
              echo "# RDP"
              echo "Address: ${TS_IP:-HOSTNAME}:${RDP_PORT}"
              echo "User: ${SSH_USER}"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
